name: Public G01 Integration

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        default: all
        type: choice
        options:
          - all
          - quality
          - ios
          - android
          - bundle-delta

permissions:
  contents: read

concurrency:
  group: public-g01-integration-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.10.0'
  NPM_VERSION: '11.10.0'
  RUBY_VERSION: '3.1.6'

jobs:
  web-mobile-quality:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'quality' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install Python compatibility shim for node-gyp
        run: python3 -m pip install --break-system-packages --upgrade setuptools
      - name: Prefetch locked sharp libvips with transport retries
        run: |
          sharp_cache="$(npm config get cache)/_libvips"
          mkdir -p "${sharp_cache}"
          curl --fail --location \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 3 \
            --retry-max-time 240 \
            --output "${sharp_cache}/libvips-8.14.5-linux-x64.tar.br" \
            https://github.com/lovell/sharp-libvips/releases/download/v8.14.5/libvips-8.14.5-linux-x64.tar.br
      - name: Install JavaScript dependencies from lockfile
        id: dependencies
        env:
          CI: 'true'
          SKIP_POD_INSTALL: 'true'
          SKIP_ANDROID_INSTALL: 'true'
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify localization
        run: |
          npm test -w @solisola/localization -- --runInBand
          npm run verify -w @solisola/localization
      - name: Test navigation foundation
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:navigation-foundation -w @audius/mobile
      - name: Test Settings foundation
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:settings-foundation -w @audius/mobile
      - name: Verify Mobile
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx turbo run verify --filter=@audius/mobile
      - name: Lint and typecheck Web
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          npx turbo run lint --filter=@audius/web
          npm run stylelint -w @audius/web
          npx turbo run typecheck --filter=@audius/web
      - name: Test Web
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run web:test -- -- run --reporter=default
      - name: Build development Web
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: packages/web
        run: npm run build:dev

  ios:
    if: ${{ inputs.scope == 'all' || inputs.scope == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
      - name: Record macOS and Xcode baseline
        run: |
          sw_vers
          xcodebuild -version
          ruby --version
          node --version
          npm --version
      - name: Install Python compatibility shim for node-gyp
        run: |
          # Python on the rolling macOS image no longer bundles distutils.
          python3 -m pip install --break-system-packages --upgrade setuptools
      - name: Install JavaScript dependencies from lockfile
        env:
          CI: 'true'
          SKIP_POD_INSTALL: 'true'
          SKIP_ANDROID_INSTALL: 'true'
          NODE_OPTIONS: --max-old-space-size=8192
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          mkdir -p "${NPM_CONFIG_CACHE}"
          soft_limit="$(ulimit -Sn)"
          hard_limit="$(ulimit -Hn)"
          echo "open-files soft=${soft_limit} hard=${hard_limit}"
          if [ "${hard_limit}" = "unlimited" ]; then
            target_limit=65536
          else
            target_limit="${hard_limit}"
          fi
          ulimit -Sn "${target_limit}"
          echo "open-files raised-soft=$(ulimit -Sn)"
          npm ci --prefer-offline --no-audit --no-fund
      - name: Install locked Ruby and CocoaPods dependencies
        working-directory: packages/mobile/ios
        run: |
          gem install bundler --version 2.5.16 --no-document
          bundle _2.5.16_ config set path vendor/bundle
          bundle _2.5.16_ install
          RCT_NEW_ARCH_ENABLED=0 bundle _2.5.16_ exec pod install --deployment
      - uses: actions/upload-artifact@v4
        with:
          name: g01-ios-pod-lock-harvest
          path: packages/mobile/ios/Podfile.lock
          if-no-files-found: error
      - name: Build shared mobile dependencies
        run: npx turbo run build --filter=@audius/mobile
      - name: Create release JavaScript bundle
        run: npm run bundle:ios -w @audius/mobile
      - name: Build unsigned iOS simulator baseline
        working-directory: packages/mobile
        run: |
          set -o pipefail
          ENVFILE=.env.dev xcodebuild \
            -workspace ios/AudiusReactNative.xcworkspace \
            -scheme Dev \
            -sdk iphonesimulator \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tee ../../g00-ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g01-ios-build-log
          path: g00-ios-build.log
          if-no-files-found: warn

  android:
    if: ${{ inputs.scope == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for Android debug build
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL /opt/microsoft
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          npm cache clean --force || true
          pip cache purge || true
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install frozen Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.1.12297006'
          sudo apt-get update
          sudo apt-get install --yes ninja-build
      - name: Record Android toolchain
        run: |
          node --version
          npm --version
          java -version
          packages/mobile/android/gradlew --version
      - name: Install JavaScript dependencies from lockfile
        env:
          CI: 'true'
          SKIP_POD_INSTALL: 'true'
          SKIP_ANDROID_INSTALL: 'true'
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Prepare disposable Android debug inputs
        run: |
          keytool -genkeypair \
            -storetype JKS \
            -keystore packages/mobile/android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname 'CN=Android Debug,O=SoliSola CI,C=US' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          npm run jetifier -w @audius/mobile
          cd packages/mobile/android
          ./gradlew :app:downloadAar --no-daemon
          echo '87e37384ef5f8755d816212890775ba94d493a70d2eff4615a8d59780ac1fc5e  libs/ffmpeg-kit-full-gpl.aar' | sha256sum --check --strict
      - name: Build shared mobile dependencies
        run: npx turbo run build --filter=@audius/mobile
      - name: Build Android debug baseline
        working-directory: packages/mobile/android
        run: |
          set -o pipefail
          ENVFILE=.env.dev ./gradlew :app:assembleProdDebug --no-daemon --stacktrace | tee ../../../g01-android-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g01-android-build-log
          path: g01-android-build.log
          if-no-files-found: warn

  bundle-delta:
    if: ${{ inputs.scope == 'bundle-delta' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@${{ env.NPM_VERSION }}
      - name: Install Python compatibility shim for node-gyp
        run: python3 -m pip install --break-system-packages --upgrade setuptools
      - name: Prefetch locked sharp libvips with transport retries
        run: |
          sharp_cache="$(npm config get cache)/_libvips"
          mkdir -p "${sharp_cache}"
          curl --fail --location \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 3 \
            --retry-max-time 240 \
            --output "${sharp_cache}/libvips-8.14.5-linux-x64.tar.br" \
            https://github.com/lovell/sharp-libvips/releases/download/v8.14.5/libvips-8.14.5-linux-x64.tar.br
      - name: Measure G00 and G01 release bundles
        env:
          CI: 'true'
          SKIP_POD_INSTALL: 'true'
          SKIP_ANDROID_INSTALL: 'true'
          NODE_OPTIONS: --max-old-space-size=8192
          G00_MIRROR_SHA: 1231a72fe6e8bdf8e147da11e3e9a2ca880367f6
          G01_MIRROR_SHA: ${{ github.sha }}
        run: |
          measure_bundle() {
            label="$1"
            npm ci --prefer-offline --no-audit --no-fund
            npx turbo run build --filter=@audius/mobile
            npm run bundle:ios -w @audius/mobile
            wc -c < packages/mobile/ios/main.jsbundle > "${RUNNER_TEMP}/${label}-bytes.txt"
          }

          git checkout --detach "${G00_MIRROR_SHA}"
          measure_bundle g00
          git clean -fdx

          git checkout --detach "${G01_MIRROR_SHA}"
          measure_bundle g01

          node -e "const fs=require('fs');const base=Number(fs.readFileSync(process.env.RUNNER_TEMP+'/g00-bytes.txt','utf8'));const current=Number(fs.readFileSync(process.env.RUNNER_TEMP+'/g01-bytes.txt','utf8'));const result={schema_version:1,g00_mirror_sha:process.env.G00_MIRROR_SHA,g01_mirror_sha:process.env.G01_MIRROR_SHA,g00_bundle_bytes:base,g01_bundle_bytes:current,delta_bytes:current-base,delta_percent:Number((((current-base)/base)*100).toFixed(4))};fs.writeFileSync('g01-bundle-delta.json',JSON.stringify(result,null,2)+'\n');console.log(result)"
      - uses: actions/upload-artifact@v4
        with:
          name: g01-bundle-delta
          path: g01-bundle-delta.json
          if-no-files-found: error
